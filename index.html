<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const STORAGE_KEY = 'baeumgil-demo-v1';
    const TEACHER_PASSWORD = 'info2026';
    const defaultState = {
      courses: ['정보','프로그래밍과 인공지능 로봇'],
      worksheets: [{title:'정보 사회와 디지털 시민', unit:'1단원 · 디지털 세상', course:'정보', note:'정보의 표현과 디지털 시민의 책임을 살펴봅니다.', isToday:true}],
      questions: []
    };
    let state = loadState();
    let currentStudent = null;
    let activeTeacherTab = 'inbox';
    let chatMessages = [];
    let toastTimer;
    let studentHeartbeat = null;
    let activityEventSource = null;
    let activityRefreshTimer = null;

    function normalizeCourse(course){if(['정보 수업','정보'].includes(course))return '정보';if(['프로그래밍','인공지능','로봇','프로그래밍과 인공지능 로봇'].includes(course))return '프로그래밍과 인공지능 로봇';return course}
    function loadState(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');const courses=Array.isArray(saved.courses)?[...new Set(saved.courses.map(normalizeCourse))]:defaultState.courses;const worksheets=Array.isArray(saved.worksheets)?saved.worksheets.map(item=>({...item,course:normalizeCourse(item.course||'정보')})):structuredClone(defaultState.worksheets);const selectedToday=new Set();for(const item of worksheets){item.isToday=Boolean(item.isToday)&&!selectedToday.has(item.course);if(item.isToday)selectedToday.add(item.course)}for(const item of worksheets)if(!selectedToday.has(item.course)){item.isToday=true;selectedToday.add(item.course)}return {...defaultState,...saved,courses,worksheets,questions:Array.isArray(saved.questions)?saved.questions.map(item=>({...item,course:normalizeCourse(item.course||'정보')})):defaultState.questions}}catch{return structuredClone(defaultState)}}
    function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
    async function sendStudentActivity(progress=currentStudent?.activityStatus||'접속 중',active=true){
      if(!currentStudent)return;
      currentStudent.activityStatus=progress;
      const questions=state.questions.filter(item=>item.classCode===currentStudent.classCode&&item.number===currentStudent.number&&item.name===currentStudent.name&&(item.course||'정보')===currentStudent.course);
      try{await fetch('/api/student-activity',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({classCode:currentStudent.classCode,course:currentStudent.course,number:currentStudent.number,name:currentStudent.name,unit:currentStudent.unit||'',progress,active,messages:chatMessages,questions})})}catch{}
    }
    async function refreshStudentMonitor(){
      try{const response=await fetch('/api/student-activity');if(!response.ok)return;renderStudentMonitor(await response.json())}catch{}
    }
    function startStudentMonitor(){
      stopStudentMonitor();
      refreshStudentMonitor();
      if('EventSource'in window){activityEventSource=new EventSource('/api/activity-events');activityEventSource.onmessage=event=>{try{renderStudentMonitor(JSON.parse(event.data))}catch{}}}
      activityRefreshTimer=setInterval(refreshStudentMonitor,10000);
    }
    function stopStudentMonitor(){if(activityEventSource){activityEventSource.close();activityEventSource=null}if(activityRefreshTimer){clearInterval(activityRefreshTimer);activityRefreshTimer=null}}
    function renderStudentMonitor(sessions){
      const list=document.getElementById('student-activity-list');
      if(!list)return;
      const now=Date.now();
      const online=sessions.filter(session=>session.active&&now-session.updatedAt<45000).length;
      const count=document.getElementById('stat-online');if(count)count.textContent=online;
      list.innerHTML=sessions.length?sessions.map(session=>{
        const isOnline=session.active&&now-session.updatedAt<45000;
        const messages=(session.messages||[]).slice(-6);
        const questions=(session.questions||[]).slice().reverse();
        return `<article class="activity-card"><div class="activity-card-head"><div><strong>${escapeHTML(session.name)} 학생</strong><small>${escapeHTML(session.classCode)} · ${escapeHTML(session.number)}번 · ${escapeHTML(session.course)}</small></div><span class="activity-presence ${isOnline?'online':''}">${isOnline?'접속 중':'최근 접속'}</span></div><div class="activity-progress"><span>현재 진행</span><strong>${escapeHTML(session.unit||'단원 선택 전')}</strong><small>${escapeHTML(session.progress||'활동 확인 중')}</small></div>${questions.length?`<div class="activity-questions"><strong>교사에게 보낸 질문</strong>${questions.map(question=>`<div class="activity-question"><span class="status-chip ${question.status==='answered'?'done':''}">${question.status==='answered'?'답변 완료':'답변 대기'}</span><p>${escapeHTML(question.text)}</p>${question.reply?`<small>교사 답변: ${escapeHTML(question.reply)}</small>`:''}</div>`).join('')}</div>`:''}<details class="activity-transcript"><summary>최근 대화 ${messages.length}개 보기</summary><div class="activity-messages">${messages.length?messages.map(message=>`<div class="activity-message ${message.role==='user'?'student':''}"><strong>${message.role==='user'?'학생':'해피콩'}</strong><span>${escapeHTML(message.text)}</span></div>`).join(''):'<p>아직 주고받은 대화가 없습니다.</p>'}</div></details><div class="activity-updated">최근 활동 ${new Date(session.updatedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</div></article>`
      }).join(''):'<div class="empty-state">아직 접속한 학생이 없습니다.<br>학생이 로그인하면 질문과 진행 상황이 여기에 나타납니다.</div>';
    }
    function escapeHTML(value=''){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
    function icon(name){const paths={book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 5.5v13A2.5 2.5 0 0 1 6.5 16H20M8 7h8M8 10h7"/>',shield:'<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/><path d="m9 12 2 2 4-4"/>',send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',spark:'<path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-2-5.8L4 11l6-2.2z"/><path d="m19 14 1 2.5 2.5 1-2.5 1L19 21l-1-2.5-2.5-1 2.5-1z"/>',upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/>',chat:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',check:'<path d="m5 12 4 4L19 6"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',arrow:'<path d="M5 12h14m-7-7 7 7-7 7"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.spark}</svg>`}

    function renderLogin(){document.getElementById('app').innerHTML=`
      <header class="shell topbar"><a class="brand" href="#" aria-label="배움길 첫 화면"><span class="brandmark">${icon('book')}</span>배움길</a><span class="topnote">중학교 정보·융합 수업 도우미</span><a class="download-link" href="/download-project.zip" download="baeumgil-project.zip">${icon('file')}<span>앱 파일 다운로드</span></a></header>
      <main class="shell login-wrap"><section class="intro"><span class="eyebrow">YOUR LEARNING COMPANION</span><h1>정답보다 먼저,<br><span>생각의 길</span>을 찾아요.</h1><p>활동지를 풀다가 막히면 작은 힌트를 받아보세요. 그래도 어렵다면 선생님께 바로 질문할 수 있어요.</p><div class="mascot-welcome"><div class="mascot-figure"><img src="/ai-images/happy-bean-mascot.png" alt="작은 책을 들고 미소 짓는 초록콩 챗봇 해피콩"><span class="mascot-hello" aria-hidden="true">✦</span></div><div class="mascot-copy"><strong>해피콩</strong>안녕! 활동지에서 막히면<br>내가 생각의 힌트를 줄게.</div></div><div class="feature-row"><div class="feature"><span class="feature-icon">${icon('spark')}</span>단계별 힌트</div><div class="feature"><span class="feature-icon">${icon('chat')}</span>선생님 연결</div><div class="feature"><span class="feature-icon">${icon('shield')}</span>정답 대신 가이드</div></div></section>
      <section class="entry-card" aria-label="로그인"><div class="entry-heading"><div><h2>수업에 참여하기</h2><p>역할에 맞는 방법으로 접속해 주세요.</p></div><span class="mini-pill">함께 배우기</span></div><div class="role-tabs" role="tablist"><button class="role-tab" id="student-tab" role="tab" aria-selected="true" type="button"><img src="/ai-images/student-bean-mascot.png" alt="">학생으로 접속</button><button class="role-tab" id="teacher-tab" role="tab" aria-selected="false" type="button"><img src="/ai-images/teacher-bean-mascot.png" alt="">교사로 접속</button></div>
      <form class="student-form" id="student-login"><div class="access-guide"><img src="/ai-images/student-bean-mascot.png" alt=""><span><strong>콩이 학생과 함께 시작해요!</strong>수업을 선택하고 활동지를 풀어보세요.</span></div><div class="field"><label for="class-code">학급 코드</label><input id="class-code" name="class-code" placeholder="예: INFO7A" autocomplete="off" required></div><div class="field"><label for="course-select">수업 선택</label><select id="course-select" name="course" required>${state.courses.map(course=>`<option value="${escapeHTML(course)}">${escapeHTML(course)}</option>`).join('')}</select></div><div class="field-grid"><div class="field"><label for="student-number">학번</label><input id="student-number" name="student-number" placeholder="예: 12" inputmode="numeric" required></div><div class="field"><label for="student-name">이름</label><input id="student-name" name="student-name" placeholder="이름 입력" required></div></div><button class="primary-button" type="submit">학생으로 들어가기 ${icon('arrow')}</button><p class="form-error" id="student-error" aria-live="polite"></p></form>
      <form class="teacher-form" id="teacher-login"><div class="access-guide"><img src="/ai-images/teacher-bean-mascot.png" alt=""><span><strong>선생님, 반가워요!</strong>수업을 만들고 학생 질문을 살펴보세요.</span></div><div class="field"><label for="teacher-password">접속 비밀번호</label><input id="teacher-password" type="password" placeholder="교사 비밀번호" autocomplete="current-password" required></div><button class="primary-button" type="submit">교사 대시보드 열기 ${icon('arrow')}</button><p class="form-error" id="teacher-error" aria-live="polite"></p><p class="security-note">${icon('lock')} 시제품 접속 비밀번호는 <b>info2026</b>입니다. 이 화면의 비밀번호 확인은 브라우저 안에서만 동작하므로 실제 학생 정보 보호나 운영용 로그인에는 사용할 수 없습니다.</p></form><div class="login-footer">수업에서 배운 만큼, 스스로 생각하는 힘이 자라나요.</div></section></main>`;
      document.getElementById('student-tab').addEventListener('click',()=>setLoginRole('student'));document.getElementById('teacher-tab').addEventListener('click',()=>setLoginRole('teacher'));
      document.getElementById('student-login').addEventListener('submit',event=>{event.preventDefault();const data=new FormData(event.currentTarget);currentStudent={classCode:String(data.get('class-code')).trim().toUpperCase(),course:String(data.get('course')).trim(),number:String(data.get('student-number')).trim(),name:String(data.get('student-name')).trim()};if(!currentStudent.classCode||!currentStudent.course||!currentStudent.number||!currentStudent.name){document.getElementById('student-error').textContent='모든 항목을 입력해 주세요.';return}chatMessages=[];renderStudent()});
      document.getElementById('teacher-login').addEventListener('submit',event=>{event.preventDefault();const pass=document.getElementById('teacher-password').value;if(pass!==TEACHER_PASSWORD){document.getElementById('teacher-error').textContent='비밀번호를 다시 확인해 주세요.';return}renderTeacherWithCourses()});}
    function setLoginRole(role){const student=role==='student';document.getElementById('student-tab').setAttribute('aria-selected',String(student));document.getElementById('teacher-tab').setAttribute('aria-selected',String(!student));document.querySelector('.student-form').classList.toggle('hidden',!student);document.querySelector('.teacher-form').classList.toggle('active',!student)}
    function studentHeader(){return `<header class="app-header"><div class="shell"><a class="brand" href="#" aria-label="배움길"><span class="brandmark">${icon('book')}</span>배움길</a><div class="user-area"><span class="avatar">${escapeHTML(currentStudent.name.slice(0,1))}</span><div><div class="user-label">${escapeHTML(currentStudent.name)} 학생</div><div class="user-sub">${escapeHTML(currentStudent.course)} · ${escapeHTML(currentStudent.classCode)} · ${escapeHTML(currentStudent.number)}번</div></div><button class="text-button" id="logout">나가기</button></div></div></header>`}
    function renderStudent(){

      document.querySelector('label[for="worksheet-title-input"]').textContent='오늘의 활동지 제목';
      document.querySelector('label[for="worksheet-unit-input"]').textContent='오늘의 단원';
      document.querySelector('label[for="worksheet-note-input"]').textContent='오늘의 학습 안내';
      const coursePanel=document.createElement('section');coursePanel.className='panel course-manager';coursePanel.id='course-panel';coursePanel.innerHTML='<h3>수업 추가</h3><p>여기에 추가한 수업이 학생 접속 화면의 수업 선택 목록에 나타납니다.</p><form class="course-form" id="course-form"><input id="course-name-input" aria-label="새 수업 이름" placeholder="예: 데이터 과학" required><button type="submit">수업 추가</button></form><div class="course-list" id="course-list"></div>';
      document.querySelector('.teacher-side').append(coursePanel);
      const monitorPanel=document.createElement('section');monitorPanel.className='panel student-monitor-panel';monitorPanel.id='student-monitor-panel';monitorPanel.innerHTML='<div class="monitor-heading"><div><h3>실시간 학생 현황</h3><p>학생이 챗봇에 보낸 질문과 현재 단원을 확인합니다.</p></div><button class="text-button" id="refresh-student-activity" type="button">새로고침</button></div><div class="activity-list" id="student-activity-list"></div>';
      document.querySelector('.teacher-side').append(monitorPanel);
      const onlineStat=document.createElement('div');onlineStat.className='stat-card';onlineStat.innerHTML='<div class="stat-label">현재 접속 학생</div><div class="stat-value" id="stat-online">0</div><div class="stat-foot">최근 45초 안에 활동한 학생</div>';
      const stats=document.querySelector('.teacher-stats');stats.classList.add('has-live-stat');stats.append(onlineStat);
      document.getElementById('course-form').addEventListener('submit',addCourse);
      document.getElementById('refresh-student-activity').addEventListener('click',refreshStudentMonitor);
      document.getElementById('logout').addEventListener('click',stopStudentMonitor);
      document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>setTeacherTab(button.dataset.tab)));
      setTeacherTab(activeTeacherTab);
      renderTeacherData();
      startStudentMonitor();
    }
    function setTeacherTab(tab){
      activeTeacherTab=tab;
      document.querySelectorAll('[data-tab]').forEach(button=>button.classList.toggle('active',button.dataset.tab===tab));
      document.getElementById('inbox-view').style.display=tab==='inbox'?'':'none';
      document.querySelector('.teacher-side').style.display=tab==='inbox'?'none':'';
      document.getElementById('upload-panel').style.display=tab==='worksheets'?'':'none';
      document.getElementById('course-panel').style.display=tab==='courses'?'':'none';
      document.getElementById('student-monitor-panel').style.display=tab==='students'?'':'none';
      const content=document.querySelector('.teacher-content');
      content.style.gridTemplateColumns=tab==='inbox'?'minmax(0,1fr)':'minmax(0,720px)';
      content.style.justifyContent=tab==='inbox'?'':'center';
      if(tab!=='inbox')document.querySelector('.teacher-side').scrollIntoView({block:'nearest',behavior:'smooth'});
      if(tab==='students')refreshStudentMonitor();
    }
    function addCourse(event){
      event.preventDefault();
      const input=document.getElementById('course-name-input');
      const course=input.value.trim();
      if(!course)return;
      if(state.courses.some(item=>item.toLocaleLowerCase()===course.toLocaleLowerCase())){showToast('이미 등록된 수업이에요.');return}
      state.courses.push(course);saveState();event.currentTarget.reset();renderTeacherData();showToast('새 수업을 학생 선택 목록에 추가했어요.');
    }
    function renderTeacherData(){
      state=loadState();
      const questions=state.questions;
      const pending=questions.filter(item=>item.status==='pending');
      document.getElementById('stat-total').textContent=questions.length;
      document.getElementById('stat-pending').textContent=pending.length;
      document.getElementById('stat-worksheets').textContent=state.worksheets.length;
      document.getElementById('pending-badge').textContent=`${pending.length}건 대기`;
      const list=document.getElementById('question-list');
      list.innerHTML=questions.length?questions.map(item=>`<article class="question-card"><div class="question-meta"><strong>${escapeHTML(item.name)} 학생</strong><span>${escapeHTML(item.classCode)} · ${escapeHTML(item.number)}번</span><span class="status-chip ${item.status==='answered'?'done':''}">${item.status==='answered'?'답변 완료':'답변 대기'}</span></div><p class="question-text">${escapeHTML(item.text)}</p><div class="context-line">${escapeHTML(item.course||'정보')} · ${escapeHTML(item.unit)} · ${new Date(item.createdAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>${item.status==='answered'?`<div style="background:#f1f6ee;border-radius:9px;padding:11px;color:#52694b;font-size:12px;line-height:1.6">보낸 답변: ${escapeHTML(item.reply)}</div>`:`<form class="reply-form" data-id="${escapeHTML(item.id)}"><input name="reply" aria-label="${escapeHTML(item.name)} 학생에게 보낼 답변" placeholder="학생에게 보낼 안내를 적어주세요" required><button type="submit">답변 보내기</button></form>`}</article>`).join(''):`<div class="empty-state">${icon('chat')}<br>아직 도착한 질문이 없습니다.<br>학생이 질문을 보내면 이곳에서 확인할 수 있어요.</div>`;
      list.querySelectorAll('.reply-form').forEach(form=>form.addEventListener('submit',replyToStudent));
      const worksheetCourse=document.getElementById('worksheet-course-input');
      if(worksheetCourse){const selected=worksheetCourse.value;worksheetCourse.innerHTML=state.courses.map(course=>`<option value="${escapeHTML(course)}">${escapeHTML(course)}</option>`).join('');if(state.courses.includes(selected))worksheetCourse.value=selected}
      const courseList=document.getElementById('course-list');
      if(courseList)courseList.innerHTML=state.courses.map(course=>`<span class="course-chip">${escapeHTML(course)}</span>`).join('');
      const uploaded=document.getElementById('uploaded-list');
      if(uploaded){uploaded.innerHTML=state.worksheets.map((item,index)=>`<div class="uploaded-item"><span class="file-icon">DOC</span><span><strong>${escapeHTML(item.title)}</strong><small>${escapeHTML(item.course||'정보')} · ${escapeHTML(item.unit)}${item.fileName?` · ${escapeHTML(item.fileName)}`:''}</small></span>${item.isToday?'<span class="today-status">오늘 수업</span>':`<button class="today-select" type="button" data-today-index="${index}">오늘로 지정</button>`}</div>`).join('');uploaded.querySelectorAll('[data-today-index]').forEach(button=>button.addEventListener('click',setTodayWorksheet))}
    }
    function addWorksheet(event){
      event.preventDefault();
      const title=document.getElementById('worksheet-title-input').value.trim();
      const unit=document.getElementById('worksheet-unit-input').value.trim();
      const course=document.getElementById('worksheet-course-input').value;
      const note=document.getElementById('worksheet-note-input').value.trim();
      const file=document.getElementById('worksheet-file').files[0];
      const isToday=document.getElementById('worksheet-is-today').checked||!state.worksheets.some(item=>item.course===course&&item.isToday);
      if(isToday)state.worksheets=state.worksheets.map(item=>item.course===course?{...item,isToday:false}:item);
      state.worksheets.unshift({title,unit,course,note,fileName:file?.name||'',isToday});saveState();event.currentTarget.reset();renderTeacherData();showToast('수업 전 학습 내용을 등록했어요.');
    }
    function setTodayWorksheet(event){const index=Number(event.currentTarget.dataset.todayIndex);const selected=state.worksheets[index];if(!selected)return;state.worksheets=state.worksheets.map(item=>({...item,isToday:item.course===selected.course&&item===selected}));saveState();renderTeacherData();showToast('학생 화면의 오늘 수업 내용을 바꿨어요.')}
    function showToast(text){const toast=document.getElementById('toast');toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
    window.addEventListener('storage',()=>{if(currentStudent){state=loadState();renderStudent()}else if(document.getElementById('question-list'))renderTeacherData();else if(document.getElementById('student-login')){state=loadState();renderLogin()}});
    renderLogin();
  </script>
</body>
</html>
